<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajith Kumar Racing | 2025 Season</title>
    <style>
        :root {
            --akr-red: #e31b23;
            --akr-black: #0a0a0a;
            --akr-gray: #1a1a1a;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--akr-black); 
            color: #fff; 
            margin: 0;
            line-height: 1.6;
        }

        /* Navigation */
        .navbar { 
            background-color: rgba(0,0,0,0.9); 
            padding: 20px; 
            border-bottom: 3px solid var(--akr-red);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .navbar h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }
        .red-text { color: var(--akr-red); }

        /* Hero Section */
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1600') center/cover; 
            height: 70vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
        }

        .hero h2 { font-size: 3rem; margin-bottom: 10px; text-transform: uppercase; }

        /* Stats Section */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
            background: var(--akr-gray);
        }

        .stat-card {
            text-align: center;
            padding: 20px;
            border-left: 4px solid var(--akr-red);
            background: #222;
        }

        .stat-number { font-size: 2rem; font-weight: bold; color: var(--akr-red); display: block; }

        /* Content Section */
        .content { padding: 50px 10%; }
        
        .btn {
            background: var(--akr-red);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn:hover { background: #b3151b; transform: translateY(-2px); }

        @media (max-width: 768px) {
            .hero h2 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>AJITH KUMAR <span class="red-text">RACING</span></h1>
    </nav>
